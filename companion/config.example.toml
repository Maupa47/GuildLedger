# GuildLedger companion - settings
#
# HOW TO USE THIS FILE
#   1. Copy this file in the same folder and name the copy  config.toml
#   2. Open config.toml with Notepad and fill in the lines marked  FILL IN  below.
#   3. Keep the quotes exactly as shown. Save.
# config.toml holds your personal upload link: never send it to anyone, never post it.
# Step-by-step guide with pictures of where to find each value: COLLECTOR.md (docs/collection/ in the repo).


# --- FILL IN: where WoW keeps the addon's data -------------------------------------------------------------
# The file appears after your first /reload or logout with GuildLedger on.
# Find it:  your WoW folder -> _forever_ -> WTF -> Account -> <your account folder> -> SavedVariables
#           -> GuildLedger.lua   (not the .bak file)
# Use single quotes ' ' around the path (then backslashes need no doubling).
sv_path = 'C:\Program Files (x86)\World of Warcraft\_forever_\WTF\Account\YOUR_ACCOUNT_FOLDER\SavedVariables\GuildLedger.lua'

# --- FILL IN: your name ------------------------------------------------------------------------------------
# Your main character's name as the guild knows it. Shown in the archive next to what you uploaded.
collector = "Your Character"

# --- FILL IN: your personal upload link (from the GuildLedger admin) --------------------------------------
[upload]
# The admin sends you a link starting with https://discord.com/api/webhooks/ ... Paste it between the quotes.
ingest_webhook = ""


# ===========================================================================================================
# Below: leave as it is unless the admin tells you otherwise.
# (TOML note: lines below a [section] header belong to that section, so these settings sit at the very end.)
# ===========================================================================================================

[general]
# "upload": send to the guild's GuildLedger bot (normal case, several officers).
# "direct": post straight to two Discord channels, without the bot (admin tests / one officer alone);
#           then fill in [direct] below and leave [upload] empty.
mode = "upload"
# Time zone for log files and Discord times. Windows without the "tzdata" package uses the PC's own time.
timezone = "Europe/Zurich"
# Where spool.db and logs/ go. Default: the folder this file is in.
# data_dir = "data"

[direct]
# Only for mode = "direct". Discord: channel -> Edit Channel -> Integrations -> Webhooks -> New Webhook
# -> Copy Webhook URL. One for the chat log channel, one for the roster log channel.
chat_webhook = ""
roster_webhook = ""
# Chat lines whose text was not captured: "summary" (one line per stretch), "lines" (each one), "skip".
meta = "summary"

[watch]
poll_seconds = 2
stable_seconds = 1
