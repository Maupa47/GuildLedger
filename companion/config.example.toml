# GuildLedger companion - settings
#
# You normally do NOT need this file: the collector package the guild's bot gives you (the admin runs
# /collector invite for you in Discord) already contains a finished config.toml. This example lists every
# setting, for setting one up by hand:
#   1. Copy this file in the same folder and name the copy  config.toml
#   2. Open config.toml with Notepad and fill in the lines marked  FILL IN  below.
#   3. Keep the quotes exactly as shown. Save.
# config.toml holds your personal upload link: never send it to anyone, never post it.
# Updates of the companion never change config.toml. Guide: COLLECTOR.md in this folder.


# --- Optional: where WoW keeps the addon's data ------------------------------------------------------------
# Leave these out: the companion finds every GuildLedger.lua itself (all your WoW accounts, so alts on a
# second account are covered too). Only if it cannot find your WoW folder, name it here:
# wow_dir = 'D:\Spiele\World of Warcraft'
# Or pin one single data file (then only this one is read):
# sv_path = 'C:\Program Files (x86)\World of Warcraft\_forever_\WTF\Account\YOUR_ACCOUNT_FOLDER\SavedVariables\GuildLedger.lua'

# --- FILL IN: your name ------------------------------------------------------------------------------------
# Your name as the guild knows you (usually your main character). Only a label on this PC: the bot knows you
# by your upload link, so it does not matter which of your characters is logged in.
collector = "Your Character"

# --- FILL IN: your personal upload link (from the GuildLedger admin) --------------------------------------
[upload]
# The admin sends you a link starting with https://discord.com/api/webhooks/ ... Paste it between the quotes.
ingest_webhook = ""


# ===========================================================================================================
# Below: leave as it is unless the admin tells you otherwise.
# (TOML note: lines below a [section] header belong to that section, so these settings sit at the very end.)
# ===========================================================================================================

[general]
# "upload": send to the guild's GuildLedger bot (normal case, several officers).
# "direct": post straight to two Discord channels, without the bot (admin tests / one officer alone);
#           then fill in [direct] below and leave [upload] empty.
mode = "upload"
# Time zone for log files and Discord times. Windows without the "tzdata" package uses the PC's own time.
timezone = "Europe/Zurich"
# Where spool.db and logs/ go. Default: the folder this file is in.
# data_dir = "data"

[direct]
# Only for mode = "direct". Discord: channel -> Edit Channel -> Integrations -> Webhooks -> New Webhook
# -> Copy Webhook URL. One for the chat log channel, one for the roster log channel.
chat_webhook = ""
roster_webhook = ""
# Chat lines whose text was not captured: "summary" (one line per stretch), "lines" (each one), "skip".
meta = "summary"

[loot]
# Amazing Hub's loot data (DKP/points, loot history, wishlists, raid attendance) for the bot's #guild-loot channel
# and the /dkp /loot /wishlist commands. Read from AmazingHub.lua in the same SavedVariables folder as sv_path.
# Needs mode = "upload". Set enabled = false to send no loot data.
enabled = true
# Only if AmazingHub.lua is somewhere else (normally leave this commented out):
# hub_sv_path = 'C:\...\SavedVariables\AmazingHub.lua'

[update]
# The companion fetches a newer version of itself from the project's GitHub releases when it starts
# (code only; this file, your data and your logs are never touched). false = update by hand.
auto = true

[watch]
poll_seconds = 2
stable_seconds = 1
