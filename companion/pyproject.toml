[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guildledger"
version = "0.5.4"
description = "GuildLedger companion: reads the GuildLedger SavedVariables file and archives/posts it"
requires-python = ">=3.11"
dependencies = []  # stdlib only; optional: tzdata on Windows for IANA time zones

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["guildledger"]
