# GuildLedger bot - settings (admin only)
#
# WHERE THIS FILE LIVES
#   Your PC:   bot\config.toml                 (copy of this file; git-ignored; the master copy you edit)
#   Server:    /etc/guildledger/config.toml    (mode 600; sent by  tools\deploy.ps1 -UpdateConfig)
# Edit bot\config.toml on your PC, then:  powershell -ExecutionPolicy Bypass -File .\tools\deploy.ps1 -UpdateConfig
# Token and webhook URLs are passwords: never paste them into chat, issues or commits.
#
# HOW TO GET DISCORD IDs (the long numbers below)
#   Discord -> User Settings -> Advanced -> turn on "Developer Mode".
#   Then right-click a channel / the server icon / a role -> "Copy ... ID".
# HOW TO GET A WEBHOOK URL
#   Right-click the channel -> Edit Channel -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL.
#   The webhook ID is the number right after /api/webhooks/ in that URL.
#
# Values marked REQUIRED must be filled in, or the bot refuses to start and says which one is missing.
# Full walkthrough: docs/collection/ADMIN.md


[discord]
# REQUIRED. https://discord.com/developers/applications -> your application -> Bot -> Reset Token -> Copy.
token = ""
# REQUIRED. ID of the private #gl-ingest channel where collectors upload (right-click it -> Copy Channel ID).
ingest_channel_id = 0
# Recommended. Your Discord server's ID (right-click the server icon -> Copy Server ID).
# With it, slash commands (/link, /seen, ...) appear at once; with 0 they can take up to an hour.
server_id = 0


[collectors]
# Normally EMPTY: add officers in Discord with  /collector invite user:@officer  (docs/collection/ADMIN.md
# section 3). The bot then makes their webhook itself and remembers it in its database.
# Only for webhooks you made by hand in #gl-ingest:
#   <webhook ID> = "<the officer's name>"
# Uploads from any other webhook are ignored. Example (made-up numbers):
# 1111111111111111111 = "First Officer"


[post]
# REQUIRED (at least one): webhook URLs of the two log channels the bot posts into.
chat_webhook = ""      # e.g. #guild-chat-log
roster_webhook = ""    # e.g. #guild-roster-log
# Time zone for the times shown in Discord.
timezone = "Europe/Zurich"
# Chat lines whose text nobody captured: "summary" (one line per stretch) | "lines" (each one) | "skip".
meta = "summary"
# Wait this long before posting chat, so another collector's copy can still add missing text.
hold_chat_seconds = 60
every_seconds = 30
# Rows older than this (unix seconds) are archived but not posted. Default: the bot's first start.
# since = 1794355200


[loot]
# Optional. Amazing Hub's loot data from the collectors (DKP/points, loot history, wishlists, raid attendance).
# FILL IN to switch posting on: webhook URL of a #guild-loot channel (Edit Channel -> Integrations -> Webhooks ->
# New Webhook -> Copy Webhook URL). The bot posts there: items handed out, points changes, and one summary per
# raid night (bosses, attendance, loot, standings). Empty = archived and /dkp /loot /wishlist work, no posts.
webhook = ""
# Wait this long before posting, so every collector's copy is merged first (seconds).
hold_seconds = 600
# How many players the standings under a raid summary show.
standings_top = 10


[ops]
# Optional monitoring. Webhook URL of a private #gl-ops channel: daily report (chat lines, share with text,
# gaps, uploads per collector) and warnings (no upload for alert_after_hours, rejected uploads). Empty = off.
webhook = ""
report_hour = 6          # local time; the report covers the previous day
alert_after_hours = 6


[backup]
# Optional. Webhook URL of a private #gl-backup channel: the daily database backup is also posted there,
# so the archive survives the loss of the server. Empty = backups stay on the server only (14 days).
webhook = ""


[link]
# Optional: what a confirmed Discord link does. Easier: set roles with /roles in Discord (saved on the
# server; wins over these values). Needs the bot permission Manage Roles, and the bot's role above them.
verified_role_id = 0     # role ID for members with a linked character in the guild (0 = off)
set_nickname = false     # true: nickname = highest-level linked character (needs Manage Nicknames)
grace_days = 7           # roles stay this long after the last linked character left the guild

[link.rank_roles]
# guild rank name = Discord role ID. Example (made-up number):
# "Officer" = 333333333333333333


[storage]
# Leave as it is on the server.
db_path = "/var/lib/guildledger/guildledger.db"


[deploy]
# Only on your PC, for tools\deploy.ps1: the SSH login of the server, e.g. "ubuntu@your-server.example".
# The bot itself ignores this section.
ssh = ""
